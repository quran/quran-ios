name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Package:
    runs-on: xcode-27
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setting up Xcode
      run: sudo xcode-select -s "/Applications/Xcode_27.2.app"

    - name: Restore Xcode build cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .build/DerivedData/no-sync
        key: ${{ runner.os }}-xcode-27.2-${{ github.job }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-xcode-27.2-${{ github.job }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-

    - name: Install xcbeautify
      run: brew install xcbeautify

    - name: Run tests
      run: make test-no-sync

    - name: Print test failures
      if: failure()
      run: Tools/print-xcresult-failures.sh .build/DerivedData/no-sync

    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: Package-xcresult
        path: .build/DerivedData/no-sync/Logs/Test/*.xcresult
        if-no-files-found: ignore

    - uses: codecov/codecov-action@a99c28d3f0da835de33ff2feb2e15691c7b9641f # v7.0.0
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

  PackageSync:
    runs-on: xcode-27
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setting up Xcode
      run: sudo xcode-select -s "/Applications/Xcode_27.2.app"

    - name: Restore Xcode build cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .build/DerivedData/sync
        key: ${{ runner.os }}-xcode-27.2-${{ github.job }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-xcode-27.2-${{ github.job }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-

    - name: Install xcbeautify
      run: brew install xcbeautify

    - name: Run tests
      run: make test-sync

    - name: Print test failures
      if: failure()
      run: Tools/print-xcresult-failures.sh .build/DerivedData/sync

    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: PackageSync-xcresult
        path: .build/DerivedData/sync/Logs/Test/*.xcresult
        if-no-files-found: ignore

  ExampleApp:
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setting up Xcode
        run: sudo xcode-select -s "/Applications/Xcode_27.2.app"

      - name: Restore Xcode build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/DerivedData/no-sync
          key: ${{ runner.os }}-xcode-27.2-${{ github.job }}-${{ hashFiles('Package.resolved', 'Package.swift', 'Example/QuranEngineApp.xcodeproj/project.pbxproj') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-xcode-27.2-${{ github.job }}-${{ hashFiles('Package.resolved', 'Package.swift', 'Example/QuranEngineApp.xcodeproj/project.pbxproj') }}-

      - name: Install xcbeautify
        run: brew install xcbeautify
      
      - name: Build
        run: make build-example-no-sync

  ExampleAppSync:
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setting up Xcode
        run: sudo xcode-select -s "/Applications/Xcode_27.2.app"

      - name: Restore Xcode build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/DerivedData/sync
          key: ${{ runner.os }}-xcode-27.2-${{ github.job }}-${{ hashFiles('Package.resolved', 'Package.swift', 'Example/QuranEngineApp.xcodeproj/project.pbxproj') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-xcode-27.2-${{ github.job }}-${{ hashFiles('Package.resolved', 'Package.swift', 'Example/QuranEngineApp.xcodeproj/project.pbxproj') }}-

      - name: Install xcbeautify
        run: brew install xcbeautify
      
      - name: Build
        run: make build-example-sync

  SwiftFormat:
    runs-on: xcode-27
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setting up Xcode
        run: sudo xcode-select -s "/Applications/Xcode_27.2.app"
      
      - name: SwiftFormat
        run: make format-lint
